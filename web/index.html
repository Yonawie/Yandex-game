<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Letter Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f4fff8;
      --muted: rgba(220, 245, 230, 0.72);
      --gold: #ffd56a;
      --panel: rgba(8, 18, 14, 0.55);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #07140f;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      touch-action: none;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }
    .stage-wrap {
      position: absolute;
      inset: 0;
      background: #07140f;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    .hud-top {
      position: absolute;
      top: calc(10px + var(--safe-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .brand {
      font-family: Unbounded, Manrope, sans-serif;
      font-weight: 800;
      font-size: clamp(1.05rem, 3.8vw, 1.45rem);
      letter-spacing: 0.04em;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
      background: linear-gradient(90deg, #c8ffe0, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hud-stats {
      text-align: right;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 110px;
    }
    .score { font-weight: 800; font-size: 1.35rem; line-height: 1; }
    .piggy { margin-top: 4px; font-size: 0.78rem; color: var(--muted); }
    .prefix-wrap {
      position: absolute;
      top: calc(64px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,213,106,.22);
      border-radius: 999px;
      padding: 8px 18px;
      min-width: 120px;
      text-align: center;
    }
    .prefix {
      font-family: Unbounded, Manrope, sans-serif;
      font-size: clamp(1.15rem, 4vw, 1.55rem);
      letter-spacing: 0.14em;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(0,0,0,.4);
    }
    .toast {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%) scale(0.96);
      background: rgba(10, 22, 16, 0.82);
      border: 1px solid rgba(255,213,106,.35);
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .22s;
      white-space: nowrap;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    .toast.show { opacity: 1; transform: translate(-50%, -60%) scale(1); }
    .hud-bottom {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(10px + var(--safe-bottom));
      display: grid;
      gap: 8px;
      pointer-events: none;
    }
    .status {
      text-align: center;
      font-size: 0.86rem;
      color: var(--muted);
      text-shadow: 0 1px 6px rgba(0,0,0,.5);
      min-height: 1.2em;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      pointer-events: auto;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }
    button {
      pointer-events: auto;
      font-family: inherit;
      font-weight: 800;
      border: 0;
      border-radius: 14px;
      padding: 12px 10px;
      color: var(--ink);
      background: rgba(22, 56, 38, 0.88);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    button.secondary { background: rgba(28, 40, 24, 0.88); }
    .pad {
      display: none;
      grid-template-columns: 58px 58px 58px;
      grid-template-rows: 50px 50px;
      gap: 6px;
      justify-content: center;
      pointer-events: auto;
      margin: 0 auto;
    }
    @media (max-width: 820px) {
      .pad { display: grid; }
    }
    .pad button { padding: 0; font-size: 1.15rem; width: 58px; height: 50px; }
    .pad .u { grid-column: 2; grid-row: 1; }
    .pad .l { grid-column: 1; grid-row: 2; }
    .pad .d { grid-column: 2; grid-row: 2; }
    .pad .r { grid-column: 3; grid-row: 2; }
    .modal {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.62);
      padding: 16px; z-index: 30;
    }
    .modal.open { display: flex; }
    .modal .card {
      width: min(560px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: #10261c;
      border: 1px solid rgba(120,200,150,.25);
      border-radius: 18px;
      padding: 16px;
    }
    .modal h2 {
      font-family: Unbounded, Manrope, sans-serif;
      margin: 0 0 8px;
      font-size: 1.2rem;
    }
    .words { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .words span {
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
    }
    .words span.locked { color: var(--muted); opacity: .7; }
    .words span.open { color: var(--gold); }
  </style>
</head>
<body>
  <div id="app">
    <div class="stage-wrap">
      <canvas id="game"></canvas>
      <div class="toast" id="toast"></div>
    </div>

    <div class="hud">
      <div class="hud-top">
        <div class="brand">LETTER SNAKE</div>
        <div class="hud-stats">
          <div class="score" id="score">0</div>
          <div class="piggy" id="piggy">Копилка 0/0</div>
        </div>
      </div>
      <div class="prefix-wrap"><div class="prefix" id="prefix">· · ·</div></div>
      <div class="hud-bottom">
        <div class="status" id="status">Собирай слова из букв</div>
        <div class="controls">
          <button id="btnRestart">Заново</button>
          <button id="btnPiggy" class="secondary">Копилка</button>
          <button id="btnStyle" class="secondary">Стиль</button>
        </div>
        <div class="pad">
          <button class="u" data-dir="0,-1">▲</button>
          <button class="l" data-dir="-1,0">◀</button>
          <button class="d" data-dir="0,1">▼</button>
          <button class="r" data-dir="1,0">▶</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="card">
      <h2>Копилка-словарь</h2>
      <div id="modalProgress" class="status"></div>
      <div class="words" id="modalWords"></div>
      <div style="margin-top:14px;text-align:right">
        <button id="btnClose">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="./game.js"></script>
</body>
</html>
