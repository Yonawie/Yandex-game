<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0610" />
    <meta
      name="description"
      content="Эхо — ломай стену букв словом. Яндекс Игры · Phaser 3."
    />
    <title>Эхо</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="preload"
      href="./fonts/manrope-cyrillic-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/unbounded-cyrillic-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 0%, #2a1830 0%, #0a0610 55%, #050608 100%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: Manrope, system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      #game canvas {
        display: block;
      }
      #boot {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #boot.hide {
        opacity: 0;
      }
      #boot .brand {
        font-family: Unbounded, Manrope, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(42px, 14vw, 64px);
        letter-spacing: 0.04em;
        color: #f4fffd;
        text-shadow: 0 0 28px rgba(92, 225, 255, 0.45);
      }
      #boot .hint {
        font-size: 13px;
        font-weight: 600;
        color: #7eb8c6;
      }
    </style>
    <script src="./sdk.js" async></script>
  </head>
  <body>
    <div id="game">
      <div id="boot" aria-live="polite">
        <div class="brand">Эхо</div>
        <div class="hint" id="boot-hint">Загрузка…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
